name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: >-
          ./gradlew --no-daemon
          :domain:testDebugUnitTest
          :core:database:testDebugUnitTest
          :data:import:testDebugUnitTest
          :data:history:testDebugUnitTest
          :data:privacy:testDebugUnitTest
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          :app:bundleRelease

      - name: Verify release APK privacy contract
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$ANALYZER" manifest permissions "$APK" | tee app/build/reports/release-permissions.txt
          if grep -q 'android.permission.INTERNET' app/build/reports/release-permissions.txt; then
            echo "Release APK unexpectedly requests android.permission.INTERNET" >&2
            exit 1
          fi

      - name: Upload verification reports and schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/reports/share-card.png
            app/build/reports/ui-polish/
            app/build/reports/release-permissions.txt
            core/database/schemas/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spotify-stats-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: spotify-stats-release-candidate
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
